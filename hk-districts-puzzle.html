<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港十八區拼圖</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F0F2F5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      background: #fff;
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      z-index: 10;
      flex-shrink: 0;
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon {
      width: 32px; height: 32px;
      background: #E05A5A; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 12px; font-weight: 700; letter-spacing: -.5px;
    }
    .logo-text { font-size: 18px; font-weight: 700; color: #1A1A1A; }
    .spacer { flex: 1; }

    .mode-tabs {
      display: flex; gap: 4px;
      padding: 4px; background: #F0F2F5; border-radius: 10px;
    }
    .mode-tab {
      padding: 6px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 500; color: #9CA3AF;
      cursor: pointer; border: none; background: transparent;
      font-family: inherit; transition: all .2s;
    }
    .mode-tab.active {
      background: #fff; font-weight: 600;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    .mode-tab.puzzle.active { color: #E05A5A; }
    .mode-tab.learn.active  { color: #4A90D9; }

    .stats-area { display: flex; align-items: center; gap: 16px; }
    .stat-label { font-size: 13px; font-weight: 500; color: #6B7280; transition: color .3s; }
    .stat-label.complete { color: #22C55E; font-weight: 700; }

    .reset-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; background: #F0F2F5;
      border: none; border-radius: 8px;
      font-size: 13px; color: #6B7280;
      cursor: pointer; font-family: inherit; transition: background .2s;
    }
    .reset-btn:hover { background: #E5E7EB; }

    /* ── Progress bar ── */
    #progress-bar { height: 4px; background: #E5E7EB; flex-shrink: 0; }
    #progress-fill {
      height: 100%; width: 0%;
      background: #E05A5A; border-radius: 0 2px 2px 0;
      transition: width .5s ease, background .5s;
    }
    #progress-fill.done { background: #22C55E; }

    /* ── Body ── */
    #body { flex: 1; display: flex; overflow: hidden; }

    /* ── Map Pane ── */
    #map-pane {
      flex: 1; display: flex; flex-direction: column;
      padding: 12px; gap: 10px; overflow: hidden;
    }
    #map-container {
      flex: 1; background: #fff; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      display: flex; flex-direction: column;
      align-items: center; padding: 10px 12px 8px;
      position: relative; overflow: hidden; min-height: 0;
    }
    #map-hint {
      font-size: 12px; color: #9CA3AF; font-weight: 500;
      padding-bottom: 6px; flex-shrink: 0; text-align: center;
    }
    #map-svg-wrapper {
      flex: 1; width: 100%; min-height: 0;
      display: flex; align-items: stretch;
    }
    #map-svg { width: 100%; height: 100%; display: block; }

    #map-legend {
      display: flex; gap: 16px; align-items: center;
      padding-top: 6px; flex-shrink: 0;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #64748B; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    /* ── Map SVG ── */
    .district-path {
      stroke: #fff; stroke-width: 1.2;
      cursor: pointer; transition: opacity .15s, fill .35s;
    }
    .district-path.empty { fill: #E2E8F0; stroke: #C5CDD8; }
    .district-path:hover  { opacity: .8; }
    .district-path.highlighted { stroke: #1A1A1A !important; stroke-width: 2.5 !important; }

    @keyframes flash-wrong {
      0%, 100% { fill: #E2E8F0; }
      25%, 75%  { fill: #FECACA; }
      50%       { fill: #FCA5A5; }
    }
    .district-path.wrong { animation: flash-wrong .5s ease; }

    .district-label {
      font-size: 9px; font-weight: 600;
      fill: rgba(255,255,255,.92); text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: rgba(0,0,0,.25); stroke-width: 2px;
    }

    /* ── Tags Panel ── */
    #tags-panel {
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      padding: 14px 16px; flex-shrink: 0;
    }
    #tags-title { font-size: 12px; font-weight: 600; color: #9CA3AF; margin-bottom: 10px; }
    #tags-grid { display: flex; flex-wrap: wrap; gap: 7px; }

    .district-tag {
      padding: 6px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; border: 2px solid transparent;
      font-family: inherit; transition: all .18s;
      user-select: none;
    }
    .district-tag.hk  { background: #FEF3F2; color: #E05A5A; }
    .district-tag.kln { background: #EFF6FF; color: #4A90D9; }
    .district-tag.nt  { background: #F0FFF4; color: #5AAE6A; }
    .district-tag.selected {
      border-color: currentColor;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      transform: translateY(-1px);
    }
    .district-tag.done {
      opacity: .45; text-decoration: line-through;
      cursor: default; pointer-events: none;
    }

    /* ── Info Panel ── */
    #info-panel {
      width: 300px; background: #fff;
      box-shadow: -2px 0 12px rgba(0,0,0,.06);
      display: flex; flex-direction: column;
      flex-shrink: 0; overflow-y: auto;
    }
    #info-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; padding: 32px; color: #9CA3AF;
    }
    .info-empty-title { font-size: 14px; font-weight: 500; }
    .info-empty-hint  { font-size: 12px; text-align: center; line-height: 1.7; color: #CBD5E1; }
    #info-content { display: none; flex-direction: column; }
    #info-banner  { padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 4px; }
    .info-region-badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 12px;
      font-size: 11px; font-weight: 600; color: #fff;
      background: rgba(255,255,255,.25); align-self: flex-start; margin-bottom: 4px;
    }
    .info-district-name { font-size: 24px; font-weight: 700; color: #fff; }
    .info-district-eng  { font-size: 13px; color: rgba(255,255,255,.7); }
    #info-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .info-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .info-stat-card {
      padding: 12px; border-radius: 12px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .info-stat-card.pop  { background: #FEF3F2; }
    .info-stat-card.area { background: #EFF6FF; }
    .info-stat-value { font-size: 15px; font-weight: 700; color: #1A1A1A; }
    .info-stat-meta  { font-size: 11px; color: #9CA3AF; }
    .info-divider    { height: 1px; background: #F3F4F6; }
    .info-section    { display: flex; flex-direction: column; gap: 6px; }
    .info-section-label { font-size: 12px; font-weight: 600; color: #9CA3AF; }
    .info-section-text  { font-size: 13px; color: #374151; line-height: 1.65; }
    .info-trip-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .info-trip-tag {
      display: inline-block;
      padding: 3px 10px;
      background: #FEF3C7;
      color: #92400E;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.5;
    }

    /* ── Toast ── */
    #toast {
      position: fixed; top: 80px; left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: #22C55E; color: #fff;
      padding: 10px 22px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 16px rgba(34,197,94,.35);
      opacity: 0; transition: all .3s; pointer-events: none; z-index: 100;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Zoom controls ── */
    #zoom-controls {
      position: absolute; right: 12px; bottom: 44px;
      display: flex; flex-direction: column;
      gap: 2px; z-index: 4;
    }
    .zoom-btn {
      width: 32px; height: 32px;
      background: #fff; border: 1px solid #E5E7EB;
      border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #374151; font-weight: 300;
      box-shadow: 0 1px 4px rgba(0,0,0,.12);
      transition: background .15s, box-shadow .15s;
      line-height: 1; user-select: none;
    }
    .zoom-btn:hover  { background: #F9FAFB; box-shadow: 0 2px 8px rgba(0,0,0,.16); }
    .zoom-btn:active { background: #F3F4F6; }
    #zoom-reset {
      width: 32px; height: 22px; font-size: 10px; font-weight: 600;
      color: #6B7280; letter-spacing: .3px; margin-top: 4px;
    }

    /* ── Loading ── */
    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: rgba(255,255,255,.9); z-index: 5;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #E5E7EB; border-top-color: #E05A5A;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Completion overlay ── */
    #completion-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      display: none; align-items: center; justify-content: center; z-index: 200;
    }
    #completion-overlay.show { display: flex; }
    .completion-card {
      background: #fff; border-radius: 24px;
      padding: 48px; text-align: center;
      max-width: 400px; width: 90%;
      box-shadow: 0 24px 64px rgba(0,0,0,.2);
      animation: pop-in .35s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes pop-in {
      from { opacity: 0; transform: scale(.85); }
      to   { opacity: 1; transform: scale(1); }
    }
    .comp-icon { font-size: 56px; margin-bottom: 12px; }
    .comp-title { font-size: 28px; font-weight: 700; color: #1A1A1A; margin-bottom: 6px; }
    .comp-sub   { font-size: 15px; color: #6B7280; margin-bottom: 32px; }
    .comp-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
    .comp-stat  { background: #F8F9FA; border-radius: 14px; padding: 18px; }
    .comp-stat-val { font-size: 26px; font-weight: 700; color: #1A1A1A; }
    .comp-stat-lbl { font-size: 12px; color: #9CA3AF; margin-top: 4px; }
    .comp-btn {
      width: 100%; padding: 14px;
      background: #E05A5A; color: #fff; border: none;
      border-radius: 12px; font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: background .2s;
    }
    .comp-btn:hover { background: #D04848; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      body { height: auto; min-height: 100vh; overflow-y: auto; }
      #header { height: auto; padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
      .logo-text { font-size: 15px; }
      #body { flex-direction: column; overflow: visible; }
      #map-pane { padding: 12px; height: auto; gap: 10px; }
      #map-container { height: 300px; flex: none; }
      #map-svg-wrapper { min-height: 0; }
      #info-panel {
        width: 100%; flex-shrink: 0;
        box-shadow: 0 -4px 20px rgba(0,0,0,.08);
        border-radius: 20px 20px 0 0;
      }
      .completion-card { padding: 32px 24px; }
    }
    @media (max-width: 480px) {
      .mode-tabs { width: 100%; }
      .mode-tab  { flex: 1; }
      .reset-btn .btn-label { display: none; }
      .stats-area { gap: 10px; }
      .stat-label { font-size: 12px; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════ HEADER ═══════════════════════════════ -->
<div id="header">
  <div class="logo">
    <div class="logo-icon">HK</div>
    <span class="logo-text">香港十八區拼圖</span>
  </div>
  <div class="spacer"></div>

  <div class="mode-tabs">
    <button class="mode-tab puzzle active" onclick="setMode('puzzle')">拼圖模式</button>
    <button class="mode-tab learn"         onclick="setMode('learn')">學習模式</button>
  </div>

  <div class="stats-area" id="stats-area">
    <span class="stat-label" id="lbl-progress">完成 0 / 18</span>
    <span class="stat-label" id="lbl-errors">錯誤次數：0</span>
  </div>

  <button class="reset-btn" onclick="resetGame()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
    </svg>
    <span class="btn-label">重置</span>
  </button>
</div>

<div id="progress-bar"><div id="progress-fill"></div></div>

<!-- ═══════════════════════════════ BODY ════════════════════════════════ -->
<div id="body">

  <!-- Map Pane -->
  <div id="map-pane">
    <div id="map-container">
      <div id="loading">
        <div class="spinner"></div>
        <span style="font-size:13px;color:#9CA3AF">載入地圖中…</span>
      </div>
      <div id="map-hint">拼圖模式：選擇下方名稱後，點選地圖對應區域</div>
      <div id="map-svg-wrapper">
        <svg id="map-svg"></svg>
        <div id="zoom-controls">
          <button class="zoom-btn" id="zoom-in"    onclick="zoomBy(1.5)" title="放大">＋</button>
          <button class="zoom-btn" id="zoom-out"   onclick="zoomBy(1/1.5)" title="縮小">－</button>
          <button class="zoom-btn" id="zoom-reset" onclick="zoomReset()" title="重置縮放">全圖</button>
        </div>
      </div>
      <div id="map-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#E05A5A"></div>香港島</div>
        <div class="legend-item"><div class="legend-dot" style="background:#4A90D9"></div>九龍</div>
        <div class="legend-item"><div class="legend-dot" style="background:#5AAE6A"></div>新界</div>
      </div>
    </div>

    <div id="tags-panel">
      <div id="tags-title">選擇行政區名稱，再點選地圖上對應位置</div>
      <div id="tags-grid"></div>
    </div>
  </div>

  <!-- Info Panel -->
  <div id="info-panel">
    <div id="info-empty">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <div class="info-empty-title">尚未選擇行政區</div>
      <div class="info-empty-hint">選擇名稱標籤後<br>點選地圖上的區域</div>
    </div>
    <div id="info-content">
      <div id="info-banner">
        <div class="info-region-badge" id="info-region">香港島</div>
        <div class="info-district-name" id="info-name">—</div>
        <div class="info-district-eng"  id="info-eng">—</div>
      </div>
      <div id="info-body">
        <div class="info-stats">
          <div class="info-stat-card pop">
            <div class="info-stat-meta">人口（普查）</div>
            <div class="info-stat-value" id="info-pop">—</div>
          </div>
          <div class="info-stat-card area">
            <div class="info-stat-meta">面積</div>
            <div class="info-stat-value" id="info-area">—</div>
          </div>
        </div>
        <div class="info-divider"></div>
        <div class="info-section">
          <div class="info-section-label">代表地標</div>
          <div class="info-section-text" id="info-landmark">—</div>
        </div>
        <div class="info-section">
          <div class="info-section-label">區域特色</div>
          <div class="info-section-text" id="info-desc">—</div>
        </div>
        <div class="info-section" id="info-trip-section" style="display:none">
          <div class="info-section-label">✈ 行程景點</div>
          <div class="info-trip-tags" id="info-trip-tags"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast / Completion -->
<div id="toast"></div>

<div id="completion-overlay">
  <div class="completion-card">
    <div class="comp-icon">🎉</div>
    <div class="comp-title">全部完成！</div>
    <div class="comp-sub">你已成功配對香港十八區</div>
    <div class="comp-stats">
      <div class="comp-stat">
        <div class="comp-stat-val" id="comp-time">—</div>
        <div class="comp-stat-lbl">完成時間</div>
      </div>
      <div class="comp-stat">
        <div class="comp-stat-val" id="comp-errors">0</div>
        <div class="comp-stat-lbl">錯誤次數</div>
      </div>
    </div>
    <button class="comp-btn" onclick="resetGame()">再玩一次</button>
  </div>
</div>

<!-- ═══════════════════════════════ SCRIPT ══════════════════════════════ -->

const REGION_META = {
  hk:  { name: '香港島', color: '#E05A5A' },
  kln: { name: '九龍',   color: '#4A90D9' },
  nt:  { name: '新界',   color: '#5AAE6A' }
};

// ─────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────
let mode        = 'puzzle';
let selectedTag = null;
let completed   = new Set();
let errors      = 0;
let startTime   = Date.now();
let svgEl, projection, pathGen, zoomBehavior, currentTransform = d3.zoomIdentity;

// ─────────────────────────────────────────────────────────────────────────
// GeoJSON
// ─────────────────────────────────────────────────────────────────────────
const GEOJSON_URLS = [
  'https://raw.githubusercontent.com/southparkstan123/hong-kong-geojson/main/hong-kong.json'
];

async function fetchGeoJSON() {
  for (const url of GEOJSON_URLS) {
    try {
      const r = await fetch(url);
      if (r.ok) return await r.json();
    } catch (_) {}
  }
  return null;
}

// Flexible property name lookup — tries many common naming conventions
function getEname(props) {
  const keys = ['ENAME','ENG_NAME','Name_Eng','DISTRICT_E','District_E','english','name_en','name'];
  for (const k of keys) {
    if (props[k] && DISTRICTS[props[k]]) return props[k];
  }
  // Last resort: scan all values
  for (const v of Object.values(props)) {
    if (typeof v === 'string' && DISTRICTS[v]) return v;
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────
// Map init
// ─────────────────────────────────────────────────────────────────────────
function initMap(geojson) {
  const wrapper = document.getElementById('map-svg-wrapper');
  const W = wrapper.clientWidth  || 600;
  const H = wrapper.clientHeight || 380;

  svgEl = d3.select('#map-svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('preserveAspectRatio', 'xMidYMid meet');

  projection = d3.geoMercator()
    .fitExtent([[4, 4], [W - 4, H - 4]], geojson);

  pathGen = d3.geoPath().projection(projection);

  const g      = svgEl.append('g').attr('class', 'g-districts');
  const gLabel = svgEl.append('g').attr('class', 'g-labels').style('display', 'none');

  g.selectAll('path')
    .data(geojson.features)
    .join('path')
      .attr('class', 'district-path empty')
      .attr('d', pathGen)
      .attr('data-ename', d => getEname(d.properties) || '')
      .on('click',      onMapClick)
      .on('mouseenter', onMapEnter)
      .on('mouseleave', onMapLeave);

  // Labels (centroid)
  geojson.features.forEach(f => {
    const ename = getEname(f.properties);
    if (!ename) return;
    const [cx, cy] = pathGen.centroid(f);
    if (isNaN(cx)) return;
    gLabel.append('text')
      .attr('class', 'district-label')
      .attr('data-ename', ename)
      .attr('x', cx).attr('y', cy + 1)
      .style('display', 'none')
      .text(DISTRICTS[ename].name.replace('區', ''));
  });

  // ── Zoom behaviour ──
  zoomBehavior = d3.zoom()
    .scaleExtent([0.8, 12])
    .on('zoom', e => {
      currentTransform = e.transform;
      svgEl.select('.g-districts').attr('transform', e.transform);
      svgEl.select('.g-labels').attr('transform', e.transform);
      // Scale stroke so borders stay crisp when zoomed
      const k = e.transform.k;
      svgEl.selectAll('.district-path')
        .style('stroke-width', (1.2 / k) + 'px');
      svgEl.selectAll('.district-label')
        .attr('font-size', (9 / k) + 'px');
    });

  svgEl.call(zoomBehavior)
    // Disable double-click zoom (conflicts with game click)
    .on('dblclick.zoom', null);

  document.getElementById('loading').style.display = 'none';
  if (mode === 'learn') applyLearnMode();
}

// ─────────────────────────────────────────────────────────────────────────
// Zoom controls
// ─────────────────────────────────────────────────────────────────────────
function zoomBy(factor) {
  svgEl.transition().duration(300)
    .call(zoomBehavior.scaleBy, factor);
}
function zoomReset() {
  svgEl.transition().duration(400)
    .call(zoomBehavior.transform, d3.zoomIdentity);
}

// ─────────────────────────────────────────────────────────────────────────
// Map events
// ─────────────────────────────────────────────────────────────────────────
function onMapClick(event, d) {
  const ename = getEname(d.properties);
  if (!ename) return;

  if (mode === 'learn') {
    svgEl.selectAll('.district-path').classed('highlighted', false);
    d3.select(this).classed('highlighted', true);
    showInfo(ename);
    return;
  }

  // Puzzle mode
  if (completed.has(ename)) { showInfo(ename); return; }
  if (!selectedTag) return;

  if (selectedTag === ename) {
    doCorrectMatch(ename, this);
  } else {
    doWrongMatch(this);
  }
}

function onMapEnter(event, d) {
  const ename = getEname(d.properties);
  if (ename && !completed.has(ename)) d3.select(this).style('opacity', .75);
}
function onMapLeave() { d3.select(this).style('opacity', null); }

// ─────────────────────────────────────────────────────────────────────────
// Game logic
// ─────────────────────────────────────────────────────────────────────────
function doCorrectMatch(ename, pathEl) {
  const d = DISTRICTS[ename];
  completed.add(ename);

  d3.select(pathEl).classed('empty', false).attr('fill', d.color);
  svgEl.select(`.district-label[data-ename="${ename}"]`).style('display', 'block');

  // Mark tag done
  document.querySelector(`.district-tag[data-ename="${ename}"]`)?.classList.add('done');

  // Deselect tag
  if (selectedTag) {
    document.querySelector(`.district-tag[data-ename="${selectedTag}"]`)?.classList.remove('selected');
    selectedTag = null;
  }

  showInfo(ename);
  showToast(`✓  ${d.name} 配對正確！`);
  updateStats();

  if (completed.size === 18) setTimeout(showCompletion, 900);
}

function doWrongMatch(pathEl) {
  errors++;
  updateStats();
  const p = d3.select(pathEl);
  p.classed('wrong', true);
  setTimeout(() => p.classed('wrong', false), 550);
}

// ─────────────────────────────────────────────────────────────────────────
// Tag clicks
// ─────────────────────────────────────────────────────────────────────────
function onTagClick(ename) {
  if (completed.has(ename)) return;

  if (selectedTag === ename) {
    document.querySelector(`.district-tag[data-ename="${ename}"]`)?.classList.remove('selected');
    selectedTag = null;
    return;
  }

  if (selectedTag) {
    document.querySelector(`.district-tag[data-ename="${selectedTag}"]`)?.classList.remove('selected');
  }
  selectedTag = ename;
  document.querySelector(`.district-tag[data-ename="${ename}"]`)?.classList.add('selected');
}

// ─────────────────────────────────────────────────────────────────────────
// Mode switching
// ─────────────────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.mode-tab.${m}`).classList.add('active');

  document.getElementById('map-hint').textContent = m === 'puzzle'
    ? '拼圖模式：選擇下方名稱後，點選地圖對應區域'
    : '學習模式：點選任一區域查看詳細資訊';

  document.getElementById('tags-panel').style.display  = m === 'puzzle' ? '' : 'none';
  document.getElementById('stats-area').style.display  = m === 'puzzle' ? 'flex' : 'none';

  if (selectedTag) {
    document.querySelector(`.district-tag[data-ename="${selectedTag}"]`)?.classList.remove('selected');
    selectedTag = null;
  }

  if (svgEl) {
    svgEl.selectAll('.district-path').classed('highlighted', false);
    m === 'learn' ? applyLearnMode() : applyPuzzleMode();
  }
}

function applyLearnMode() {
  svgEl.selectAll('.district-path').each(function(d) {
    const ename = getEname(d.properties);
    if (ename) d3.select(this).classed('empty', false).attr('fill', DISTRICTS[ename].color);
  });
  svgEl.selectAll('.district-label').style('display', 'block');
}

function applyPuzzleMode() {
  svgEl.selectAll('.district-path').each(function(d) {
    const ename = getEname(d.properties);
    if (!ename) return;
    if (completed.has(ename)) {
      d3.select(this).classed('empty', false).attr('fill', DISTRICTS[ename].color);
    } else {
      d3.select(this).classed('empty', true).attr('fill', null);
    }
  });
  svgEl.selectAll('.district-label').each(function() {
    const ename = d3.select(this).attr('data-ename');
    d3.select(this).style('display', completed.has(ename) ? 'block' : 'none');
  });
}

// ─────────────────────────────────────────────────────────────────────────
// UI helpers
// ─────────────────────────────────────────────────────────────────────────
function updateStats() {
  const pct  = (completed.size / 18) * 100;
  const fill = document.getElementById('progress-fill');
  fill.style.width = pct + '%';
  fill.className = 'done' in fill.classList || completed.size === 18 ? 'done' : '';
  if (completed.size === 18) fill.classList.add('done');

  const lbl = document.getElementById('lbl-progress');
  lbl.textContent = `完成 ${completed.size} / 18`;
  lbl.className = completed.size === 18 ? 'stat-label complete' : 'stat-label';
  document.getElementById('lbl-errors').textContent = `錯誤次數：${errors}`;
}

function showInfo(ename) {
  const d = DISTRICTS[ename];
  const r = REGION_META[d.region];

  document.getElementById('info-empty').style.display   = 'none';
  const content = document.getElementById('info-content');
  content.style.display = 'flex';

  document.getElementById('info-banner').style.background =
    `linear-gradient(150deg, ${d.color} 0%, ${d.color}BB 100%)`;
  document.getElementById('info-region').textContent   = r.name;
  document.getElementById('info-name').textContent     = d.name;
  document.getElementById('info-eng').textContent      = d.eng;
  document.getElementById('info-pop').textContent      = d.population;
  document.getElementById('info-area').textContent     = d.area;
  document.getElementById('info-landmark').textContent = d.landmark;
  document.getElementById('info-desc').textContent     = d.desc;

  const tripSection = document.getElementById('info-trip-section');
  const tripTags    = document.getElementById('info-trip-tags');
  if (d.trip && d.trip.length) {
    tripTags.innerHTML = d.trip.map(s => `<span class="info-trip-tag">${s}</span>`).join('');
    tripSection.style.display = '';
  } else {
    tripSection.style.display = 'none';
  }
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ─────────────────────────────────────────────────────────────────────────
// Completion
// ─────────────────────────────────────────────────────────────────────────
function showCompletion() {
  const secs = Math.floor((Date.now() - startTime) / 1000);
  const m = Math.floor(secs / 60), s = secs % 60;
  document.getElementById('comp-time').textContent   = m ? `${m} 分 ${s} 秒` : `${s} 秒`;
  document.getElementById('comp-errors').textContent = errors;
  document.getElementById('completion-overlay').classList.add('show');
}

// ─────────────────────────────────────────────────────────────────────────
// Reset
// ─────────────────────────────────────────────────────────────────────────
function resetGame() {
  completed.clear(); errors = 0; selectedTag = null; startTime = Date.now();
  updateStats();

  document.querySelectorAll('.district-tag').forEach(t =>
    t.classList.remove('selected', 'done'));

  if (svgEl) {
    svgEl.selectAll('.district-path')
      .classed('empty', true).classed('highlighted', false).attr('fill', null);
    svgEl.selectAll('.district-label').style('display', 'none');
  }

  document.getElementById('info-empty').style.display   = 'flex';
  document.getElementById('info-content').style.display = 'none';
  document.getElementById('completion-overlay').classList.remove('show');

  if (mode !== 'puzzle') setMode('puzzle');
}

// ─────────────────────────────────────────────────────────────────────────
// Build tag list (shuffled)
// ─────────────────────────────────────────────────────────────────────────
function buildTags() {
  const grid = document.getElementById('tags-grid');
  const entries = Object.entries(DISTRICTS).sort(() => Math.random() - .5);
  entries.forEach(([ename, d]) => {
    const btn = document.createElement('button');
    btn.className = `district-tag ${d.region}`;
    btn.textContent = d.name;
    btn.dataset.ename = ename;
    btn.addEventListener('click', () => onTagClick(ename));
    grid.appendChild(btn);
  });
}

// ─────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────
async function init() {
  buildTags();

  const geojson = await fetchGeoJSON();
  if (geojson) {
    initMap(geojson);
  } else {
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;padding:24px;color:#9CA3AF">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="1.5" style="margin-bottom:10px">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <div style="font-size:14px;margin-bottom:6px">無法載入地圖資料</div>
        <div style="font-size:12px">請確認網路連線後重新整理頁面</div>
      </div>`;
  }
}

init();
</script>
